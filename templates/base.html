<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nedara Monitoring{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% block favicon %}{% endblock %}

    <!-- Anti-FOUC: apply saved theme class before any render -->
    <script>
        (function () {
            const t = localStorage.getItem('nedara-theme') || 'auto';
            const dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (dark) document.documentElement.classList.add('dark');
        })();
    </script>

    <!-- Tailwind CDN (load first), then config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } }
        }
    </script>
    <style type="text/tailwindcss">
        body { @apply font-sans antialiased; }
    </style>
    <style>
        .btn-theme {
            background: transparent !important; color: #64748b !important;
            border: 1px solid #e2e8f0 !important; border-radius: 8px !important;
            font-size: 0.75rem !important; height: 28px !important;
            min-width: 0 !important; padding: 0 0.6rem !important; cursor: pointer;
        }
        .dark .btn-theme { color: #94a3b8 !important; border-color: rgba(51,65,85,0.65) !important; }
        .btn-theme:hover { background: #f1f5f9 !important; color: #6366f1 !important; border-color: rgba(99,102,241,0.3) !important; }
        .dark .btn-theme:hover { background: rgba(99,102,241,0.1) !important; color: #818cf8 !important; }
    </style>

    {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

    {% block body %}{% endblock %}

    <!-- Theme utilities — available globally on all pages -->
    <script>
        function applyThemeClass(theme) {
            const root = document.documentElement;
            if (theme === 'dark')       root.classList.add('dark');
            else if (theme === 'light') root.classList.remove('dark');
            else window.matchMedia('(prefers-color-scheme: dark)').matches
                ? root.classList.add('dark')
                : root.classList.remove('dark');
        }

        // Update the theme button icon + label (works on any page with #theme-icon / #theme-label)
        function updateThemeButton(theme) {
            const map = {
                auto:  { icon: '⊙', label: 'Auto'  },
                light: { icon: '☀', label: 'Light' },
                dark:  { icon: '☾', label: 'Dark'  },
            };
            const { icon, label } = map[theme] || map.auto;
            const i = document.getElementById('theme-icon');
            const l = document.getElementById('theme-label');
            if (i) i.textContent = icon;
            if (l) l.textContent = label;
        }

        // Cycle to next theme, apply it, update button, return the new value
        function cycleTheme() {
            const order = ['auto', 'light', 'dark'];
            const cur  = localStorage.getItem('nedara-theme') || 'auto';
            const next = order[(order.indexOf(cur) + 1) % order.length];
            localStorage.setItem('nedara-theme', next);
            applyThemeClass(next);
            updateThemeButton(next);
            return next;
        }

        // Initialize button state on every page load
        updateThemeButton(localStorage.getItem('nedara-theme') || 'auto');

        // Keep class in sync when OS preference changes (only affects 'auto' mode)
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
            if ((localStorage.getItem('nedara-theme') || 'auto') === 'auto') {
                applyThemeClass('auto');
            }
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
